name: portal_front

services:
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: dev
    image: portal-front:local
    container_name: portal_web
    env_file: .env
    ports:
      - "3100:3000"
    volumes:
      - .:/app
    networks: [portal_net]

networks:
  # Created by portal_back (docker compose up there first).
  portal_net:
    external: true
